[project]
name = "agentchaos-backend"
version = "0.1.0"
description = "AgentChaos reliability test platform — T01 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pymysql[rsa]>=1.1,<2",
  "redis>=5.2,<8",
  "celery[redis]>=5.5,<6",
  "langgraph>=1.0,<2",
  "langchain-deepseek>=0.1,<2",
  "langgraph-checkpoint-redis>=0.1,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: read-only checks against configured MySQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
